<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — FrqBit AI</title>
    <meta name="description" content="Secure checkout powered by Stripe — FrqBit AI">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        /* ===== Reset & Base ===== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0f;
            --bg-card: #12121a;
            --bg-surface: #1a1a2e;
            --text: #e4e4e7;
            --text-dim: #a1a1aa;
            --text-muted: #71717a;
            --border: rgba(255,255,255,0.06);
            --primary: #7c3aed;
            --primary-light: #a78bfa;
            --gradient: linear-gradient(135deg, #7c3aed 0%, #a855f7 50%, #ec4899 100%);
            --success: #10b981;
            --danger: #ef4444;
            --radius: 16px;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* ===== Top Nav Bar ===== */
        .checkout-nav {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            background: rgba(10,10,15,0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .checkout-nav .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            font-size: 1.15rem;
        }
        .logo-icon { font-size: 1.3rem; }
        .logo-hi { background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .secure-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            color: var(--success);
            font-weight: 500;
        }
        .secure-badge i { font-size: 0.7rem; }

        /* ===== Layout ===== */
        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
        .checkout-layout {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 48px;
            padding: 48px 0 80px;
            align-items: start;
        }

        /* ===== Left: Order Summary ===== */
        .order-section h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .order-section h2 i {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-right: 8px;
        }
        .order-subtitle {
            color: var(--text-dim);
            font-size: 0.92rem;
            margin-bottom: 32px;
        }

        /* Product card */
        .order-product {
            display: flex;
            gap: 20px;
            padding: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 24px;
        }
        .order-product-icon {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: rgba(255,255,255,0.8);
            flex-shrink: 0;
        }
        .order-product-info { flex: 1; }
        .order-product-name {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 4px;
        }
        .order-product-desc {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 10px;
        }
        .order-product-features {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .order-product-features li {
            font-size: 0.72rem;
            padding: 3px 10px;
            background: rgba(124,58,237,0.1);
            border: 1px solid rgba(124,58,237,0.15);
            border-radius: 50px;
            color: var(--primary-light);
        }

        /* Plan details */
        .order-plan {
            padding: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 24px;
        }
        .order-plan-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .order-plan-label {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .order-plan-name {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
        }
        .order-plan-name .plan-badge {
            display: inline-block;
            padding: 3px 10px;
            background: var(--gradient);
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 700;
            color: #fff;
            vertical-align: middle;
            margin-left: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .order-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 0.92rem;
        }
        .order-line .label { color: var(--text-dim); }
        .order-line .value { font-weight: 600; }
        .order-line.total {
            border-top: 1px solid var(--border);
            margin-top: 8px;
            padding-top: 16px;
            font-size: 1.05rem;
        }
        .order-line.total .value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Plan features */
        .plan-features {
            list-style: none;
            margin-top: 20px;
        }
        .plan-features li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            font-size: 0.88rem;
            color: var(--text-dim);
        }
        .plan-features li i {
            color: var(--success);
            font-size: 0.7rem;
            width: 16px;
            text-align: center;
        }

        /* Trust badges */
        .trust-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .trust-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.78rem;
            color: var(--text-dim);
            flex: 1;
            min-width: 140px;
        }
        .trust-badge i {
            font-size: 0.9rem;
            color: var(--success);
        }

        /* ===== Right: Payment Panel ===== */
        .payment-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            position: sticky;
            top: 80px;
        }
        .payment-panel h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .payment-panel h3 i {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .payment-subtitle {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        /* Stripe button */
        .stripe-pay-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: var(--gradient);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .stripe-pay-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(124,58,237,0.35);
        }
        .stripe-pay-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .stripe-pay-btn .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .or-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .or-divider::before, .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-dim);
            font-size: 0.88rem;
            text-decoration: none;
            transition: all 0.3s;
        }
        .back-link:hover {
            border-color: rgba(124,58,237,0.3);
            color: var(--text);
        }

        .payment-note {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.7;
        }
        .payment-note a { color: var(--primary-light); text-decoration: underline; }
        .powered-by {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .powered-by i { font-size: 1.6rem; color: #635bff; }

        /* ===== Error State ===== */
        .checkout-error {
            text-align: center;
            padding: 80px 24px;
            max-width: 560px;
            margin: 0 auto;
        }
        .checkout-error .error-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(239,68,68,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 2rem;
            color: var(--danger);
        }
        .checkout-error h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .checkout-error p { color: var(--text-dim); margin-bottom: 24px; }
        .checkout-error .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            background: var(--gradient);
            color: #fff;
            transition: all 0.3s;
        }
        .checkout-error .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(124,58,237,0.3);
        }

        /* ===== Loading state ===== */
        .checkout-loading {
            text-align: center;
            padding: 120px 24px;
        }
        .checkout-loading .spinner-lg {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px;
        }
        .checkout-loading p {
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        /* ===== Responsive ===== */
        @media (max-width: 900px) {
            .checkout-layout {
                grid-template-columns: 1fr;
                gap: 32px;
                padding: 32px 0 60px;
            }
            .payment-panel { position: static; }
        }
        @media (max-width: 480px) {
            .order-product { flex-direction: column; gap: 14px; }
            .trust-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <!-- Nav -->
    <nav class="checkout-nav">
        <div class="container">
            <a href="/" class="logo">
                <span class="logo-icon">⚡</span>
                <span>FrqBit<span class="logo-hi">AI</span></span>
            </a>
            <span class="secure-badge">
                <i class="fas fa-lock"></i> Secured by Stripe
            </span>
        </div>
    </nav>

    <!-- Main -->
    <main class="container" id="checkoutMain">
        <div class="checkout-loading" id="loadingState">
            <div class="spinner-lg"></div>
            <p>Preparing your checkout…</p>
        </div>
    </main>

    <script>
    /* ======================================================
       FrqBit AI — Stripe Checkout Page
       Static client-side Stripe Checkout integration.
       
       SETUP INSTRUCTIONS:
       1. Go to https://dashboard.stripe.com/products
       2. Create a product (e.g. "Vocab Memory AI — Starter")
       3. Add a recurring price ($5/mo, $10/mo, $20/mo)
       4. Copy each Price ID (starts with "price_")
       5. Paste them into PRODUCTS config below
       6. Go to https://dashboard.stripe.com/apikeys
       7. Copy your Publishable Key (starts with "pk_")
       8. Paste it as STRIPE_PUBLISHABLE_KEY below
       
       URL FORMAT (for product sites to link to):
       https://frqbitai.com/checkout.html?product=vocab-memory-ai&plan=starter
       https://frqbitai.com/checkout.html?product=vocab-memory-ai&plan=pro
       https://frqbitai.com/checkout.html?product=vocab-memory-ai&plan=unlimited
       ====================================================== */

    // ──────────────────────────────────────────────
    // 🔑 STRIPE PUBLISHABLE KEY
    // Replace with your key from: https://dashboard.stripe.com/apikeys
    // Use pk_test_... for testing, pk_live_... for production
    // ──────────────────────────────────────────────
    const STRIPE_PUBLISHABLE_KEY = 'pk_test_REPLACE_WITH_YOUR_STRIPE_PUBLISHABLE_KEY';

    // ──────────────────────────────────────────────
    // 🏷️ PRODUCT & PLAN CATALOG
    // Each product has plans with Stripe Price IDs.
    // Create products+prices at: https://dashboard.stripe.com/products
    // ──────────────────────────────────────────────
    const PRODUCTS = {
        'vocab-memory-ai': {
            name: 'Vocab Memory AI',
            icon: 'fas fa-brain',
            gradient: 'linear-gradient(135deg, #06b6d4, #3b82f6)',
            description: 'AI-powered vocabulary learning with 15 science-backed methods',
            tags: ['GPT-4o', '15 Methods', 'Spaced Repetition', 'AI Stories'],
            returnUrl: 'https://vocab-memory-ai.vercel.app',
            plans: {
                'starter': {
                    name: 'Starter',
                    badge: null,
                    priceId: 'price_REPLACE_STARTER_MONTHLY',  // ← Replace with Stripe Price ID
                    amount: 5,
                    currency: 'USD',
                    interval: 'month',
                    mode: 'subscription',
                    wordsPerDay: '50 words/day',
                    features: [
                        'Everything in Free + AI power',
                        'GPT-4o deep content generation',
                        'Word DNA (root analysis)',
                        'Confusable words & usage notes',
                        'Difficulty classification',
                        '50 word searches per day'
                    ]
                },
                'pro': {
                    name: 'Pro',
                    badge: 'Most Popular',
                    priceId: 'price_REPLACE_PRO_MONTHLY',      // ← Replace with Stripe Price ID
                    amount: 10,
                    currency: 'USD',
                    interval: 'month',
                    mode: 'subscription',
                    wordsPerDay: '200 words/day',
                    features: [
                        'Everything in Starter',
                        '200 word searches per day',
                        'HD AI-generated images (DALL·E)',
                        'Advanced analytics & insights',
                        'Priority processing speed',
                        'All 15 learning methods'
                    ]
                },
                'unlimited': {
                    name: 'Unlimited',
                    badge: 'Best Value',
                    priceId: 'price_REPLACE_UNLIMITED_MONTHLY', // ← Replace with Stripe Price ID
                    amount: 20,
                    currency: 'USD',
                    interval: 'month',
                    mode: 'subscription',
                    wordsPerDay: 'Unlimited words/day',
                    features: [
                        'Everything in Pro',
                        'Unlimited word searches',
                        'AI story video clips',
                        'HD AI-generated images',
                        'Early access to new features',
                        'All current & future methods'
                    ]
                }
            }
        }
        // ──────────────────────────────────────────────
        // Add more products here as you launch them:
        //
        // 'your-next-product': {
        //     name: 'Product Name',
        //     icon: 'fas fa-icon',
        //     gradient: 'linear-gradient(...)',
        //     description: '...',
        //     tags: ['Tag1', 'Tag2'],
        //     returnUrl: 'https://your-product.vercel.app',
        //     plans: {
        //         'basic': {
        //             name: 'Basic',
        //             priceId: 'price_...',  // Stripe Price ID
        //             amount: 9,
        //             currency: 'USD',
        //             interval: 'month',
        //             mode: 'subscription',
        //             features: ['Feature 1', 'Feature 2']
        //         }
        //     }
        // }
        // ──────────────────────────────────────────────
    };

    // ──────────────────────────────────────────────
    //  CHECKOUT LOGIC (no edits needed below)
    // ──────────────────────────────────────────────
    const SUCCESS_URL = window.location.origin + '/success.html';
    const CANCEL_URL  = window.location.origin + '/cancel.html';

    const mainEl = document.getElementById('checkoutMain');

    function getParams() {
        const params = new URLSearchParams(window.location.search);
        return {
            productId: params.get('product'),
            planId:    params.get('plan'),
        };
    }

    function showError(title, message) {
        mainEl.innerHTML = `
            <div class="checkout-error">
                <div class="error-icon"><i class="fas fa-exclamation-triangle"></i></div>
                <h2>${title}</h2>
                <p>${message}</p>
                <a href="/" class="btn"><i class="fas fa-home"></i> Back to FrqBit AI</a>
            </div>`;
    }

    function renderCheckout(product, plan, productId, planId) {
        const interval = plan.interval === 'year' ? '/year' : '/mo';
        const currencySymbol = plan.currency === 'USD' ? '$' : plan.currency;

        mainEl.innerHTML = `
        <div class="checkout-layout">
            <!-- Left: Order Summary -->
            <div class="order-section">
                <h2><i class="fas fa-receipt"></i> Order Summary</h2>
                <p class="order-subtitle">Review your selection before proceeding to payment</p>

                <div class="order-product">
                    <div class="order-product-icon" style="background: ${product.gradient};">
                        <i class="${product.icon}"></i>
                    </div>
                    <div class="order-product-info">
                        <div class="order-product-name">${product.name}</div>
                        <div class="order-product-desc">${product.description}</div>
                        <ul class="order-product-features">
                            ${product.tags.map(t => `<li>${t}</li>`).join('')}
                        </ul>
                    </div>
                </div>

                <div class="order-plan">
                    <div class="order-plan-header">
                        <span class="order-plan-label">Selected Plan</span>
                        <span class="order-plan-name">
                            ${plan.name}
                            ${plan.badge ? `<span class="plan-badge">${plan.badge}</span>` : ''}
                        </span>
                    </div>

                    ${plan.wordsPerDay ? `
                    <div class="order-line">
                        <span class="label"><i class="fas fa-search" style="margin-right:6px;color:var(--primary-light);"></i> Daily Limit</span>
                        <span class="value">${plan.wordsPerDay}</span>
                    </div>` : ''}

                    <div class="order-line">
                        <span class="label"><i class="fas fa-sync" style="margin-right:6px;color:var(--primary-light);"></i> Billing</span>
                        <span class="value">${plan.mode === 'subscription' ? `Recurring ${plan.interval}ly` : 'One-time'}</span>
                    </div>

                    <div class="order-line">
                        <span class="label"><i class="fas fa-tag" style="margin-right:6px;color:var(--primary-light);"></i> Price</span>
                        <span class="value">${currencySymbol}${plan.amount}${interval}</span>
                    </div>

                    <div class="order-line total">
                        <span class="label">Total Due Today</span>
                        <span class="value">${currencySymbol}${plan.amount}</span>
                    </div>

                    <ul class="plan-features">
                        ${plan.features.map(f => `<li><i class="fas fa-check"></i> ${f}</li>`).join('')}
                    </ul>
                </div>

                <div class="trust-row">
                    <div class="trust-badge"><i class="fas fa-lock"></i> SSL Encrypted</div>
                    <div class="trust-badge"><i class="fas fa-shield-alt"></i> Stripe Secured</div>
                    <div class="trust-badge"><i class="fas fa-undo"></i> Cancel Anytime</div>
                </div>
            </div>

            <!-- Right: Payment Panel -->
            <div class="payment-panel">
                <h3><i class="fas fa-credit-card"></i> Payment</h3>
                <p class="payment-subtitle">You'll be redirected to Stripe's secure checkout</p>

                <button class="stripe-pay-btn" id="stripePayBtn">
                    <i class="fas fa-lock"></i> Pay ${currencySymbol}${plan.amount}${interval}
                </button>

                <div class="or-divider">or</div>

                <a href="${product.returnUrl}" class="back-link">
                    <i class="fas fa-arrow-left"></i> Return to ${product.name}
                </a>

                <div class="payment-note">
                    <p>By clicking "Pay", you agree to our
                        <a href="/terms">Terms of Service</a> and
                        <a href="/privacy">Privacy Policy</a>.
                        ${plan.mode === 'subscription' ? 'Your subscription renews automatically. Cancel anytime from your account or contact us.' : ''}
                    </p>
                </div>

                <div class="powered-by">
                    <span>Powered by</span>
                    <i class="fab fa-stripe"></i>
                </div>
            </div>
        </div>`;

        // Attach Stripe handler
        const payBtn = document.getElementById('stripePayBtn');
        payBtn.addEventListener('click', () => handleStripeCheckout(payBtn, plan, productId, planId));
    }

    async function handleStripeCheckout(btn, plan, productId, planId) {
        // Check if Stripe is configured
        if (STRIPE_PUBLISHABLE_KEY.includes('REPLACE')) {
            alert(
                '⚙️ Stripe is not configured yet.\n\n' +
                'To set up payments:\n' +
                '1. Go to https://dashboard.stripe.com/apikeys\n' +
                '2. Copy your Publishable Key\n' +
                '3. Open checkout.html and replace STRIPE_PUBLISHABLE_KEY\n' +
                '4. Create Products & Prices in Stripe Dashboard\n' +
                '5. Replace priceId values in PRODUCTS config'
            );
            return;
        }

        if (plan.priceId.includes('REPLACE')) {
            alert(
                '⚙️ Stripe Price ID not set for this plan.\n\n' +
                'Go to https://dashboard.stripe.com/products\n' +
                'Create a price and update the priceId in checkout.html'
            );
            return;
        }

        // Start checkout
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Redirecting to Stripe…';

        try {
            const stripe = Stripe(STRIPE_PUBLISHABLE_KEY);

            const params = {
                lineItems: [{ price: plan.priceId, quantity: 1 }],
                mode: plan.mode || 'subscription',
                successUrl: SUCCESS_URL + '?product=' + productId + '&plan=' + planId + '&session_id={CHECKOUT_SESSION_ID}',
                cancelUrl:  CANCEL_URL  + '?product=' + productId + '&plan=' + planId,
            };

            const { error } = await stripe.redirectToCheckout(params);

            if (error) {
                alert('Payment error: ' + error.message);
                console.error('Stripe error:', error);
            }
        } catch (err) {
            alert('Something went wrong. Please try again.');
            console.error('Checkout error:', err);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-lock"></i> Pay $' + plan.amount + '/' + (plan.interval === 'year' ? 'year' : 'mo');
        }
    }

    // ──────────────────────────────────────────────
    //  INIT
    // ──────────────────────────────────────────────
    function init() {
        const { productId, planId } = getParams();

        if (!productId || !planId) {
            showError('Missing Information', 'No product or plan was specified. Please go back and select a plan.');
            return;
        }

        const product = PRODUCTS[productId];
        if (!product) {
            showError('Product Not Found', `We couldn't find a product with ID "${productId}". Please check the link and try again.`);
            return;
        }

        const plan = product.plans[planId];
        if (!plan) {
            const available = Object.keys(product.plans).join(', ');
            showError('Plan Not Found', `The plan "${planId}" doesn't exist for ${product.name}. Available plans: ${available}`);
            return;
        }

        renderCheckout(product, plan, productId, planId);
    }

    init();
    </script>
</body>
</html>
